name: Release

# Pushing a tag vX.Y.Z (must equal VERSION) builds the Windows installer and attaches it to a
# DRAFT release: review the notes, then publish (publishing also triggers handbook.yml, which
# attaches the Architecture Handbook PDF). How-to: docs/how-to/build-the-installer.md.
#
# Edition: the full installer bundles design/music/ (Git LFS); in the music-free lite mirror the
# folder is absent, stage-genesis.mjs skips it, and the artifact is named ...-Lite-...
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds the installer as a workflow artifact, creates no release

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write # only the release step writes
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # pulled below through a cache - LFS bandwidth is metered

      - name: Restore LFS objects from cache
        shell: bash
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: Pull LFS objects (cache misses only)
        run: git lfs pull

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v (VERSION)"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Test the generator
        run: dotnet test dps-nn.slnx --configuration Release

      - name: Build installer
        working-directory: gui
        shell: bash
        run: |
          npm ci
          npm run build
          node scripts/stage-genesis.mjs
          v="$(tr -d '[:space:]' < ../VERSION)"
          name="DPS-NN-Setup-$v.exe"
          grep -q '"edition": "lite"' ../build/genesis/install-root.json && name="DPS-NN-Lite-Setup-$v.exe"
          npx electron-builder --win --publish never \
            -c.extraMetadata.version="$v" -c.nsis.artifactName="$name"
          echo "INSTALLER=gui/dist/$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ env.INSTALLER }}

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "DPS-NN $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$INSTALLER" --clobber
